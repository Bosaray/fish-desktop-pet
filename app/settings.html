<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline'"><title>鱼鱼桌宠设置</title><style>*{box-sizing:border-box}body{margin:0;background:#171b22;color:#eef1f7;font:14px/1.8 'Microsoft YaHei UI',sans-serif;padding:28px}h1{font-size:22px}label{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #333b47}select,button{font:inherit;color:inherit;background:#242d3b;border:1px solid #465367;border-radius:9px;padding:8px 12px}input{accent-color:#83c9c2}p{color:#b4bfce}button{cursor:pointer}#message{min-height:28px}</style><h1>桌宠设置</h1><p>这里调整本机外观与操作权限。自主行为的概率、冷却和触达次数统一在 QQ 控制台管理。</p><label>显示大小<select id="scale"></select></label><label>所在屏幕<select id="displayId"></select></label><div id="switches"></div><p>离线不累计饥饿，重连不补扣。食欲只影响行为，没有死亡和永久惩罚。</p><p>玩法：右键“和鱼鱼玩”可选泡泡、玩球、收藏、小窝和取食。概率与冷却在 QQ 控制台管理。</p><p>点击零食盒即可补充零食。右键“摆放道具”可找回或隐藏小窝、零食盒。开封后中断记为没吃完，不退回整份。</p><p id="message"></p><button id="save">保存本机设置</button> <button id="panel">打开 QQ 控制台 · 桌宠</button><script>
const fields={soundEnabled:'互动音效',alwaysOnTop:'始终置顶（含全屏窗口）',ignoreMouse:'鼠标穿透',allowMouse:'允许接触后玩鼠标',allowIcons:'允许搬动图标',allowWindows:'允许推动窗口',observeScreen:'允许自动观察屏幕',captureAllowed:'允许主人通过 QQ 请求截图',serverEnabled:'连接服务器 QQ 鱼鱼'};
async function init(){const data=await fishSettings.read();for(const v of [.5,.75,1,1.25,1.5,2,2.5,3]){const o=new Option(Math.round(v*100)+'%',v);o.selected=v===data.cfg.scale;scale.add(o);}for(const d of data.displays){const o=new Option(d.label,d.id);o.selected=d.selected;displayId.add(o);}for(const [id,title] of Object.entries(fields)){const label=document.createElement('label');label.append(title);const input=document.createElement('input');input.type='checkbox';input.id=id;input.checked=data.cfg[id]!==false;label.append(input);switches.append(label);}message.textContent=data.connection?.connected?'QQ 鱼鱼已连接':'暂未连接；本机外观设置仍可保存。';}
save.onclick=async()=>{try{const patch=Object.fromEntries(Object.keys(fields).map(id=>[id,document.getElementById(id).checked]));patch.scale=Number(scale.value);patch.displayId=Number(displayId.value);await fishSettings.save(patch);message.textContent='本机设置已保存。';}catch(e){message.textContent=e.message;}};
panel.onclick=()=>fishSettings.save({openPanel:true});init().catch(e=>message.textContent=e.message);
</script></html>
